name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Check release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node -e "const p=require('./package.json'); if(process.env.RELEASE_TAG !== 'v'+p.version) { console.error('Release tag must be v'+p.version); process.exit(1); }"
      - name: Install latest npm for trusted publishing
        run: npm install --global npm@latest
      - name: Validate package
        run: |
          npm run check
          npm test
          npm pack --dry-run
      - name: Publish public package via npm trusted publishing
        run: npm publish --access public --provenance
